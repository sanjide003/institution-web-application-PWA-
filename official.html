  <style>
/* ==========================================
   FEE TRACKER PRO - GLOBAL CSS (ORIGINAL)
   Used for Admin, Cashier, Student & Index
   ========================================== */

:root { 
    /* Admin Colors */
    --background-light: #f3f4f6; 
    --text-light: #1f2937; 
    --card-light: #ffffff; 
    --border-light: #e5e7eb; 
    --primary-light: #3b82f6; 
    
    /* Index/Student Colors */
    --primary: #0f172a; 
    --accent: #3b82f6; 
    --white: #ffffff; 
    --text-dark: #1e293b; 
    --text-gray: #64748b; 
    --header-height: 70px;
}

* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; 
    -webkit-tap-highlight-color: transparent; 
}

html { scroll-behavior: smooth !important; }
body { overflow-x: hidden; }
body.modal-scroll-lock {
    overflow: hidden !important;
    overscroll-behavior: none;
}
.skip-link {
    position: absolute;
    left: -9999px;
    top: 8px;
    z-index: 10000;
    background: #1d4ed8;
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-weight: 700;
}
.skip-link:focus { left: 8px; }
:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
.input-error { border-color: #dc2626 !important; box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15) !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

body { background-color: var(--background-light); color: var(--text-light); }
a { text-decoration: none; color: inherit; transition: 0.2s; }
ul { list-style: none; }
img { display: block; max-width: 100%; }
.hidden { display: none !important; }
.page-content { content-visibility: auto; contain-intrinsic-size: 1px 800px; }

.card { background-color: var(--card-light); border: 1px solid var(--border-light); }
.btn-primary { background-color: var(--accent); color: #ffffff; transition: 0.2s; cursor: pointer; border: none; }
.btn-primary:hover { background-color: #2563eb; }
.btn-primary:disabled { background-color: #9ca3af; cursor: not-allowed; }

.popup-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); z-index: 5000; }
.modal-overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 15px; }
.modal-box { background: #ffffff; width: 100%; max-width: 340px; padding: 25px 20px; border-radius: 20px; position: relative; animation: popUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.15); }
@keyframes popUp { from { transform: scale(0.9) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

.form-input { width: 100%; padding: 12px 14px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; margin-bottom: 15px; outline: none; font-weight: 500; transition: 0.2s; color: #0f172a; font-size: 14px; }
.form-input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.suggestions-box { position: absolute; width: 100%; max-height: 160px; overflow-y: auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; z-index: 10; top: 100%; left: 0; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: left; display: none; padding: 5px; }
.suggestions-box.active { display: block; }
.suggestion-item { padding: 12px 10px; cursor: pointer; border-radius: 8px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; color: var(--text-dark);}
.suggestion-item:hover { background: #f1f5f9; color: var(--accent); }

.mandatory-star { color: #ef4444; font-weight: bold; margin-left: 2px; }
input, select, textarea { background-color: #ffffff; border-color: #d1d5db; color: #1f2937; transition: border 0.2s; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }

#auth-loader { position: fixed; inset: 0; background: #f3f4f6; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#admin-app { display: none; }

header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); position: sticky; top: 15px; z-index: 1000; border: 1px solid #f1f5f9; height: var(--header-height); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); border-radius: 16px; margin: 15px auto; width: calc(100% - 30px); max-width: 1200px; }
@media (max-width: 768px) { header { margin: 10px; width: calc(100% - 20px); border-radius: 12px; top: 10px; } }
.nav-container { height: 100%; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; position: relative; }
.header-logo-box { width: 45px; height: 45px; flex-shrink: 0; z-index: 10; display: flex; align-items: center;}
.header-logo-box img { max-height: 100%; max-width: 100%; border-radius: 8px; object-fit: contain; opacity: 0; transition: opacity 0.5s ease; }

.header-center-box { position: absolute; left: 50%; transform: translateX(-50%); width: 55%; text-align: center; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
.header-center-box h1 { font-weight: 800; color: var(--primary); white-space: normal; line-height: 1.2; width: 100%; margin: 0 auto; font-size: 14px; word-wrap: break-word; }
.header-center-box p { font-size: 10px; color: var(--text-gray); font-weight: 600; white-space: nowrap; opacity: 0.8; margin-top: 2px; }

.nav-menu { display: flex; gap: 15px; align-items: center; z-index: 10; }
.nav-link { font-size: 14px; font-weight: 600; color: var(--text-dark); cursor: pointer; transition: 0.2s; }
.nav-link:hover { color: var(--accent); }
.nav-link.active { background: #111111 !important; color: #ffffff !important; }
.login-btn-nav { padding: 8px 20px; background: var(--primary); color: var(--white); border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: transform 0.2s; border: none; box-shadow: 0 4px 10px rgba(15, 23, 42, 0.15);}
.login-btn-nav:hover { transform: translateY(-2px); }

.mobile-toggle { display: block; color: var(--primary); cursor: pointer; padding: 5px 10px; z-index: 1001; position: relative; }
.menu-icon-wrapper { width: 24px; height: 24px; position: relative; display: flex; align-items: center; justify-content: center; }
.menu-icon-wrapper i { position: absolute; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 22px; }
.icon-bars { opacity: 1; transform: rotate(0deg) scale(1); }
.icon-close { opacity: 0; transform: rotate(-90deg) scale(0.5); }
.active-toggle .icon-bars { opacity: 0; transform: rotate(90deg) scale(0.5); }
.active-toggle .icon-close { opacity: 1; transform: rotate(0deg) scale(1); color: #ef4444; }

.nav-menu { position: absolute; top: calc(100% + 10px); right: 0; width: min(280px, calc(100vw - 30px)); max-height: min(70vh, 560px); overflow-y: auto; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(15px); flex-direction: column; align-items: stretch; padding: 15px; gap: 8px; border: 1px solid #f1f5f9; border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); transform: translateY(-15px) scale(0.95); opacity: 0; pointer-events: none; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; transform-origin: top right; z-index: 900; display: flex; }
.nav-menu.active { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
.nav-link { font-size: 14px; width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 15px; text-align: left; border-radius: 10px; }
.nav-link:hover { background: #f8fafc; }
.login-btn-nav { width: 100%; text-align: center; justify-content: center; padding: 10px; margin-top: 5px; }

/* Dashboard and Modals */
.official-metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.official-metric-card{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #dbeafe;border-radius:18px;background:linear-gradient(135deg,#fff,#eff6ff);padding:14px;box-shadow:0 8px 20px rgba(15,23,42,.06)}
.official-metric-card i{font-size:24px;opacity:.75}
.official-metric-card.green{border-color:#bbf7d0;background:linear-gradient(135deg,#fff,#f0fdf4);color:#166534}
.official-metric-card.teal{border-color:#99f6e4;background:linear-gradient(135deg,#fff,#f0fdfa);color:#0f766e}
.official-metric-card.indigo{border-color:#c7d2fe;background:linear-gradient(135deg,#fff,#eef2ff);color:#3730a3}
.official-metric-card.amber{border-color:#fde68a;background:linear-gradient(135deg,#fff,#fffbeb);color:#92400e}
.official-metric-card.purple{border-color:#e9d5ff;background:linear-gradient(135deg,#fff,#faf5ff);color:#7e22ce}
.official-metric-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:900;color:#64748b}
.official-metric-value{font-size:26px;line-height:1;font-weight:900;color:#0f172a;margin-top:4px}
.official-quick-card,.official-card-button,.official-student-card{width:100%;text-align:left;border:1px solid #e2e8f0;background:#fff;border-radius:18px;padding:14px;box-shadow:0 8px 20px rgba(15,23,42,.05);transition:transform .2s,box-shadow .2s,border-color .2s}
.official-quick-card:hover,.official-card-button:hover,.official-student-card:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(15,23,42,.09);border-color:#93c5fd}
.official-quick-card{display:flex;flex-direction:column;gap:7px}
.official-quick-card i{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#eef2ff;color:#4f46e5;font-size:18px}
.official-quick-card b{color:#0f172a}
.official-quick-card span{font-size:12px;font-weight:700;color:#64748b}
.official-card-button{padding:0;margin-bottom:10px}
.official-card-button .official-profile-card{border:0;box-shadow:none;width:100%;min-height:auto}
.official-student-card{display:none;margin-bottom:10px}

.id-card{width:336px;max-width:100%;min-height:210px;background:#fff;border:1px solid #dbe4f0;border-radius:18px;padding:14px;box-shadow:0 8px 20px rgba(15,23,42,.06)}
.id-card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.id-photo{width:56px;height:56px;border-radius:12px;object-fit:cover;border:1px solid #cbd5e1}
.badge{padding:4px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:700}
.details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.detail-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px}
.detail-label{font-size:10px;text-transform:uppercase;color:#64748b;font-weight:800}
.detail-value{font-size:12px;color:#0f172a;font-weight:600;word-break:break-word}

/* ==========================================
   PROFESSIONAL REPORT BUILDER / SPREADSHEET STYLES
   ========================================== */

.fmt-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid transparent; color: #1e293b; background: transparent; cursor: pointer; transition: 0.15s; display: flex; align-items: center; justify-content: center;}
.fmt-btn:hover { background: #e2e8f0; border-color: #cbd5e1; }
.fmt-btn:active { transform: scale(0.95); }
.fmt-color-picker { width: 32px; height: 32px; padding: 2px; border-radius: 6px; border: 1px solid #cbd5e1; cursor: pointer; background: #fff; }

/* The Data Table */
.builder-table { border-collapse: collapse; width: 100%; }
.builder-table th, .builder-table td { border: 1px solid #cbd5e1; padding: 6px 8px; text-align: left; font-size: 13px; color: #0f172a; background: #ffffff; }
.builder-table th { background-color: #f8fafc; font-weight: 700; vertical-align: bottom; }

/* Excel Headers (A, B, C & 1, 2, 3) */
.col-header, .row-header, .select-all-btn { background-color: #e2e8f0 !important; color: #475569 !important; font-size: 11px !important; text-align: center !important; user-select: none; }
.col-header:hover, .row-header:hover, .select-all-btn:hover { background-color: #cbd5e1 !important; color: #0f172a !important; }
.col-header.selected, .row-header.selected, .select-all-btn.selected { background-color: #94a3b8 !important; color: #fff !important; }

/* Resizing handles */
.builder-th { position: relative; }
.col-resizer { position: absolute; right: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 20; transition: background 0.2s; }
.col-resizer:hover { background: rgba(37,99,235,0.8); }

/* In-cell Controls */
.builder-col-select, .builder-col-title-input { border: 1px solid #cbd5e1; border-radius: 4px; padding: 3px 6px; font-size: 11px; background: #fff; color: #334155; outline: none; font-weight: 600; }
.builder-col-title-input:focus, .builder-col-select:focus { border-color: #3b82f6; }

/* Cell Formatting & Selection */
.builder-cell { outline: none; transition: background-color 0.1s; }
.builder-cell:focus { outline: 2px solid #2563eb; outline-offset: -2px; z-index: 5; position: relative; }
.builder-cell.selected { background-color: #dbeafe !important; }

/* Print Settings */
.print-only-heading { display: none; font-size: 13px; color: #000; font-weight: bold;}
.builder-print-header { display: none; }
.builder-print-header.show-on-screen { display: table-header-group; }
.print-header-content { text-align: center; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 2px solid #1e293b; }
.print-inst-name { font-size: 24px; font-weight: 900; text-transform: uppercase; color: #0f172a; margin: 0; }
.print-inst-sub { font-size: 14px; font-weight: 600; color: #334155; margin: 2px 0; }
.print-inst-reg { font-size: 12px; font-weight: 700; color: #475569; margin: 2px 0; }
.print-custom-title { font-size: 18px; font-weight: 800; color: #1e3a8a; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

@media print {
    body.is-printing { background: #fff; margin: 0; padding: 0; }
    body.is-printing * { visibility: hidden; }
    body.is-printing #print-canvas, body.is-printing #print-canvas * { visibility: visible; }
    body.is-printing #print-canvas { position: absolute; left: 0; top: 0; width: 100% !important; max-width: none !important; margin: 0; padding: 0; border: none; box-shadow: none; overflow: visible; }
    body.is-printing .no-print { display: none !important; }
    body.is-printing .print-only-heading { display: block !important; }
    body.is-printing .builder-print-header { display: table-header-group !important; }
    .page-break-before { page-break-before: always; break-before: page; }
    @page { margin: 1cm; }
}

/* Canvas Boundary Warning (Desktop Preview) */
.print-canvas { min-height: 500px; padding: 0; margin: 0 auto; background: white; position: relative; overflow-x: visible; border-right: 2px dashed #ef4444; }
.print-canvas[data-paper="A4"][data-orient="portrait"] { width: 210mm; }
.print-canvas[data-paper="A4"][data-orient="landscape"] { width: 297mm; }
.print-canvas[data-paper="Legal"][data-orient="portrait"] { width: 8.5in; }
.print-canvas[data-paper="Legal"][data-orient="landscape"] { width: 14in; }

/* Custom Scrollbar for Spreadsheet */
.spreadsheet-container::-webkit-scrollbar { height: 10px; width: 10px; }
.spreadsheet-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px;}
.spreadsheet-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
.spreadsheet-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>

  <!-- Session Guard Logic -->
  <script>
    (function () {
        const DEFAULT_SESSION_MAX_AGE_MS = 1000 * 60 * 15;
        const DEFAULT_SESSION_IDLE_MAX_AGE_MS = 1000 * 60 * 10;
        const ROLE_SESSION_POLICY = {
            student: { maxAgeMs: 1000 * 60 * 30, idleMs: 1000 * 60 * 20 },
            staff: { maxAgeMs: 0, idleMs: 0 },
            admin: { maxAgeMs: 1000 * 60 * 15, idleMs: 1000 * 60 * 10 }
        };
        const STAFF_STATE_KEY = 'app_session_staff_state';
        const ADMIN_STATE_KEY = 'app_session_admin_state';
        const STUDENT_STATE_KEY = 'app_session_student_state';
        const STUDENT_ACCOUNTS_KEY = 'app_student_accounts';
        const CURRENT_ROLE_KEY = 'app_session_current_role';
        const FLASH_KEY = 'app_session_flash';

        const now = () => Date.now();
        const readJson = (key) => { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (error) { return null; } };
        const writeJson = (key, value) => localStorage.setItem(key, JSON.stringify(value));
        const removeKey = (key) => localStorage.removeItem(key);
        const setCurrentRole = (role = '') => { if (role) sessionStorage.setItem(CURRENT_ROLE_KEY, role); else sessionStorage.removeItem(CURRENT_ROLE_KEY); };
        const getRole = () => sessionStorage.getItem(CURRENT_ROLE_KEY) || '';
        const buildState = (extra = {}) => { const timestamp = now(); return { startedAt: timestamp, lastActiveAt: timestamp, ...extra }; };
        const getSessionPolicy = (role = '') => ROLE_SESSION_POLICY[role] || { maxAgeMs: DEFAULT_SESSION_MAX_AGE_MS, idleMs: DEFAULT_SESSION_IDLE_MAX_AGE_MS };

        const isStateFresh = (state, role = getRole()) => {
            if (!state || !state.lastActiveAt || !state.startedAt) return false;
            const policy = getSessionPolicy(role);
            const age = now() - Number(state.startedAt);
            const idle = now() - Number(state.lastActiveAt);
            const maxAgeMs = Number(policy.maxAgeMs || 0);
            const idleMs = Number(policy.idleMs || 0);
            const ageOk = maxAgeMs <= 0 || age <= maxAgeMs;
            const idleOk = idleMs <= 0 || idle <= idleMs;
            return ageOk && idleOk;
        };

        const getStaffState = () => readJson(STAFF_STATE_KEY);
        const getAdminState = () => readJson(ADMIN_STATE_KEY);
        const getStudentState = () => readJson(STUDENT_STATE_KEY);
        const getStudentAccounts = () => { const accounts = readJson(STUDENT_ACCOUNTS_KEY); return Array.isArray(accounts) ? accounts : []; };
        const saveStudentAccounts = (accounts = []) => writeJson(STUDENT_ACCOUNTS_KEY, accounts);
        const getStateByRole = (role) => { if (role === 'staff') return getStaffState(); if (role === 'admin') return getAdminState(); if (role === 'student') return getStudentState(); return null; };
        const setFlash = (message) => { if (message) sessionStorage.setItem(FLASH_KEY, message); };

        const clearClientData = async () => {
            try {
                const preserve = {};
                const savedStudentAccounts = localStorage.getItem(STUDENT_ACCOUNTS_KEY);
                if (savedStudentAccounts) preserve[STUDENT_ACCOUNTS_KEY] = savedStudentAccounts;
                localStorage.clear();
                Object.entries(preserve).forEach(([key, value]) => localStorage.setItem(key, value));
            } catch (error) {}
            if ('caches' in window) { try { const cacheNames = await caches.keys(); await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName))); } catch (error) {} }
        };

        const clearAll = async (options = {}) => {
            [STAFF_STATE_KEY, ADMIN_STATE_KEY, STUDENT_STATE_KEY].forEach(removeKey);
            setCurrentRole('');
            if (options.purgeClientData) await clearClientData();
        };

        const pruneExpiredStates = () => {
            if (!isStateFresh(getStaffState(), 'staff')) removeKey(STAFF_STATE_KEY);
            if (!isStateFresh(getAdminState(), 'admin')) removeKey(ADMIN_STATE_KEY);
            const studentState = getStudentState();
            if (studentState && !studentState.studentId) removeKey(STUDENT_STATE_KEY);
        };

        const touchSession = () => {
            const role = getRole();
            const state = getStateByRole(role);
            if (!state) return;
            if (role !== 'student' && !isStateFresh(state, role)) return;
            writeJson(role === 'admin' ? ADMIN_STATE_KEY : role === 'staff' ? STAFF_STATE_KEY : STUDENT_STATE_KEY, { ...state, lastActiveAt: now() });
        };

        const hasStaffSession = () => isStateFresh(getStaffState(), 'staff');
        const hasAdminSession = () => isStateFresh(getAdminState(), 'admin');
        const hasStudentSession = () => Boolean(getStudentState()?.studentId);
        const redirectHome = (message = '') => { setFlash(message); window.location.href = 'index.html'; };

        let activityBound = false;
        const bindActivityTracking = () => {
            if (activityBound) return;
            activityBound = true;
            let lastTouch = 0;
            const throttledTouch = () => { const currentTime = now(); if ((currentTime - lastTouch) < 15000) return; lastTouch = currentTime; touchSession(); };
            ['click', 'keydown', 'pointerdown', 'focus'].forEach((eventName) => { window.addEventListener(eventName, throttledTouch, { passive: true }); });
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') throttledTouch(); });
        };

        pruneExpiredStates();
        bindActivityTracking();

        window.AppSession = {
            SESSION_MAX_AGE_MS: DEFAULT_SESSION_MAX_AGE_MS,
            SESSION_IDLE_MAX_AGE_MS: DEFAULT_SESSION_IDLE_MAX_AGE_MS,
            SESSION_POLICY: ROLE_SESSION_POLICY,
            clearAll,
            consumeFlash() { const message = sessionStorage.getItem(FLASH_KEY) || ''; if (message) sessionStorage.removeItem(FLASH_KEY); return message; },
            getStartedAt() { const role = getRole(); const state = getStateByRole(role); return Number(state?.startedAt || 0); },
            getLastActiveAt() { const role = getRole(); const state = getStateByRole(role); return Number(state?.lastActiveAt || 0); },
            getRole,
            getRolePolicy(role = getRole()) { return getSessionPolicy(role); },
            getStudentId() { const state = getStudentState(); return state?.studentId || ''; },
            getStaffName() { const state = getStaffState(); return state?.name || ''; },
            getStaffEmail() { const state = getStaffState(); return state?.email || ''; },
            isFresh() { const role = getRole(); return isStateFresh(getStateByRole(role), role); },
            startStudent(studentId, profile = {}) {
                writeJson(STUDENT_STATE_KEY, buildState({ studentId, role: 'student' }));
                const accounts = getStudentAccounts();
                const nextAccount = { studentId, name: profile.name || '', class: profile.class || '', adm: profile.adm || '', updatedAt: now() };
                const nextAccounts = [nextAccount, ...accounts.filter((acc) => acc.studentId !== studentId)].slice(0, 8);
                saveStudentAccounts(nextAccounts);
                setCurrentRole('student');
            },
            getStudentAccounts() { return getStudentAccounts(); },
            switchStudent(studentId = '') {
                const account = getStudentAccounts().find((item) => item.studentId === studentId);
                if (!account) return false;
                this.startStudent(studentId, account);
                return true;
            },
            logoutStudent(studentId = '', { removeAccount = false } = {}) {
                const activeStudentId = studentId || this.getStudentId();
                if (removeAccount && activeStudentId) {
                    const nextAccounts = getStudentAccounts().filter((account) => account.studentId !== activeStudentId);
                    saveStudentAccounts(nextAccounts);
                }
                removeKey(STUDENT_STATE_KEY);
                if (getRole() === 'student') setCurrentRole('');
            },
            startStaff(name = '', email = '', access = null) {
                writeJson(STAFF_STATE_KEY, buildState({ name, email, role: 'staff', access: access && typeof access === 'object' ? access : null }));
                setCurrentRole('staff');
            },
            getStaffAccess() { const state = getStaffState(); return (state?.access && typeof state.access === 'object') ? state.access : null; },
            startAdmin() { writeJson(ADMIN_STATE_KEY, buildState({ role: 'admin' })); setCurrentRole('admin'); },
            touchSession,
            guardStudentPage() {
                pruneExpiredStates();
                if (!hasStudentSession()) { redirectHome('Please log in to continue.'); return; }
                setCurrentRole('student');
                if (!this.getStudentId()) redirectHome('Please select your student profile again.');
            },
            guardStaffOrAdminPage() {
                pruneExpiredStates();
                if (hasAdminSession()) { setCurrentRole('admin'); return; }
                if (hasStaffSession()) { setCurrentRole('staff'); return; }
                redirectHome('Your staff/admin session expired. Please log in again.');
            },
            guardStaffPageAccess(requiredPage = 'collection') {
                pruneExpiredStates();
                if (hasAdminSession()) { setCurrentRole('admin'); return; }
                if (!hasStaffSession()) { redirectHome('Your staff session expired. Please log in again.'); return; }
                setCurrentRole('staff');
                const access = this.getStaffAccess();
                if (requiredPage === 'collection' && access && access.collection !== true) { redirectHome('Your account does not have collection page access.'); return; }
                if (requiredPage === 'student' && access && access.student !== true) { redirectHome('Your account does not have student page access.'); return; }
                if (requiredPage === 'result' && access) {
                    const hasResultAccess = access.result === true || access.canManageResults === true;
                    const collectionFallback = access.collection === true && window.location.search.includes('from=collection');
                    if (!hasResultAccess && !collectionFallback) { redirectHome('Your account does not have result page access.'); }
                }
            },
            guardAdminPage() {
                pruneExpiredStates();
                const requestedTab = (window.location.hash || '#dashboard').replace('#', '') || 'dashboard';
                const wantsResultsTab = requestedTab === 'results';
                if (hasAdminSession()) { setCurrentRole('admin'); return; }
                if (wantsResultsTab && hasStaffSession()) { setCurrentRole('staff'); return; }
                redirectHome('Your admin session expired. Please log in again.');
            }
        };
    }());
  </script>

              return `<td class="builder-cell" contenteditable="true" data-row="${startIndex + rIndex}" data-col="${cIndex}">${escapeHtml(String(cellValue))}</td>`;

      document.querySelectorAll('.delete-col-btn').forEach(btn => btn.addEventListener('click', (e) => {
        const idx = parseInt(e.currentTarget.dataset.colIndex);

          builderConfig.columns.splice(idx, 1);
          renderExportTab();
        } else {
          alert("At least one column is required.");

      }));
    
      document.querySelectorAll('.builder-col-select').forEach(sel => sel.addEventListener('change', (e) => {
        saveBuilderState();
        const idx = parseInt(e.target.dataset.colIndex);
        const fieldId = e.target.value;
        builderConfig.columns[idx].field = fieldId;
        const fieldLabel = availableDataFields.find(f => f.id === fieldId)?.label || 'Column';
        if(fieldId !== 'CUSTOM') builderConfig.columns[idx].title = fieldLabel;
        else builderConfig.columns[idx].width = '150px'; // fixed for blank
        renderExportTab();
      }));
    
      document.querySelectorAll('.builder-col-title-input').forEach(input => input.addEventListener('input', (e) => {
        const idx = parseInt(e.target.dataset.colIndex);
        builderConfig.columns[idx].title = e.target.value;
        e.target.closest('th').querySelector('.print-only-heading').textContent = e.target.value;
      }));

      // --- Formatting Logic ---
      const applyFormat = (styleProp, valueFn) => {
          saveBuilderState();
          document.querySelectorAll('.builder-cell.selected').forEach(td => {
              td.style[styleProp] = typeof valueFn === 'function' ? valueFn(td.style[styleProp]) : valueFn;
          });
      };
      
      const getActiveFontSize = () => parseInt(document.getElementById('fmt-size-input').value) || 13;
      
      document.getElementById('fmt-bold')?.addEventListener('click', () => applyFormat('fontWeight', val => val === 'bold' ? 'normal' : 'bold'));
      document.getElementById('fmt-italic')?.addEventListener('click', () => applyFormat('fontStyle', val => val === 'italic' ? 'normal' : 'italic'));
      document.getElementById('fmt-color')?.addEventListener('input', (e) => applyFormat('color', e.target.value));
      document.getElementById('fmt-bg')?.addEventListener('input', (e) => applyFormat('backgroundColor', e.target.value));
      
      document.getElementById('fmt-size-plus')?.addEventListener('click', () => {
          let size = getActiveFontSize() + 1;
          document.getElementById('fmt-size-input').value = size;
          applyFormat('fontSize', size + 'px');
      });
      document.getElementById('fmt-size-minus')?.addEventListener('click', () => {
          let size = Math.max(8, getActiveFontSize() - 1);
          document.getElementById('fmt-size-input').value = size;
          applyFormat('fontSize', size + 'px');
      });
      document.getElementById('fmt-size-input')?.addEventListener('change', (e) => {
          applyFormat('fontSize', e.target.value + 'px');
      });

      // Undo Redo binding
      document.getElementById('fmt-undo')?.addEventListener('click', undoBuilder);
      document.getElementById('fmt-redo')?.addEventListener('click', redoBuilder);
    
      document.getElementById('btn-export-print')?.addEventListener('click', () => {

        window.print();
        setTimeout(() => document.body.classList.remove('is-printing'), 500);

      document.getElementById('btn-export-excel')?.addEventListener('click', () => {

        const tableClone = document.getElementById('builder-table').cloneNode(true);

        tableClone.querySelectorAll('th').forEach(th => {
           const heading = th.querySelector('.print-only-heading');
           if(heading) th.textContent = heading.textContent;

    const updateCanvasStyle = () => {
      const canvas = document.getElementById('print-canvas');
      if(canvas) {
        canvas.dataset.paper = builderConfig.paper;
        canvas.dataset.orient = builderConfig.orientation;
      }
    };
    
    const setupExcelEngine = () => {
        const table = document.getElementById('builder-table');
        if (!table) return;
    
        // 1. Resize Column
        let resizingCol = null;
        let startX = 0;
        let startWidth = 0;
    
        document.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('col-resizer')) {
                saveBuilderState();
                resizingCol = e.target.closest('th');
                startX = e.pageX;
                startWidth = resizingCol.offsetWidth;
                e.preventDefault();
            }
        });
    
        document.addEventListener('mousemove', (e) => {
            if (resizingCol) {
                const newWidth = startWidth + (e.pageX - startX);
                if (newWidth > 30) {
                    resizingCol.style.width = newWidth + 'px';
                    const colIndex = resizingCol.querySelector('.col-resizer').dataset.colIndex;
                    if(builderConfig.columns[colIndex]) {
                        builderConfig.columns[colIndex].width = newWidth + 'px';
                    }
                }
            }
        });
        document.addEventListener('mouseup', () => { resizingCol = null; });
    
        // 2. Excel Selection Engine
        let isSelecting = false;
        let startCell = null;
    
        const getCellCoords = (td) => {
            return { row: parseInt(td.dataset.row), col: parseInt(td.dataset.col) };
        };

        const clearSelection = () => document.querySelectorAll('.builder-cell, .col-header, .row-header, .select-all-btn').forEach(c => c.classList.remove('selected'));
    
        table.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('col-resizer')) return; 
            
            // Col Selection
            const colHeader = e.target.closest('th.col-header');
            if (colHeader) {
                clearSelection();
                colHeader.classList.add('selected');
                document.querySelectorAll(`.builder-cell[data-col="${colHeader.dataset.col}"]`).forEach(c => c.classList.add('selected'));
                return;
            }
            // Row Selection
            const rowHeader = e.target.closest('td.row-header');
            if (rowHeader) {
                clearSelection();
                rowHeader.classList.add('selected');
                document.querySelectorAll(`.builder-cell[data-row="${rowHeader.dataset.row}"]`).forEach(c => c.classList.add('selected'));
                return;
            }
            // Select All
            const selectAll = e.target.closest('.select-all-btn');
            if (selectAll) {
                clearSelection();
                selectAll.classList.add('selected');
                document.querySelectorAll('.builder-cell').forEach(c => c.classList.add('selected'));
                return;
            }

            // Normal Cell Selection
            const td = e.target.closest('td.builder-cell');
            if (td) {
                isSelecting = true;
                startCell = getCellCoords(td);
                clearSelection();
                td.classList.add('selected');
            }
        });
    
        table.addEventListener('mouseover', (e) => {
            if (isSelecting) {
                const td = e.target.closest('td.builder-cell');
                if (td) {
                    const endCell = getCellCoords(td);
                    const minR = Math.min(startCell.row, endCell.row);
                    const maxR = Math.max(startCell.row, endCell.row);
                    const minC = Math.min(startCell.col, endCell.col);
                    const maxC = Math.max(startCell.col, endCell.col);
                    
                    document.querySelectorAll('.builder-cell').forEach(cell => {
                        const r = parseInt(cell.dataset.row);
                        const c = parseInt(cell.dataset.col);
                        if (r >= minR && r <= maxR && c >= minC && c <= maxC) {
                            cell.classList.add('selected');
                        } else {
                            cell.classList.remove('selected');
                        }
                    });
                }
            }
        });
    
        document.addEventListener('mouseup', () => isSelecting = false);
        
        // Save state before typing
        table.addEventListener('focusin', (e) => {
            if(e.target.classList.contains('builder-cell')) {
                e.target.dataset.original = e.target.innerHTML;
            }
        });
        table.addEventListener('focusout', (e) => {
            if(e.target.classList.contains('builder-cell')) {
                if(e.target.dataset.original !== e.target.innerHTML) {
                    // It changed. To properly undo, we should have saved before.
                    // Simplified: We'll push current state. True undo needs more robust handling for contenteditable.
                    saveBuilderState();
                }
            }
        });
    
        // 3. Copy & Paste Engine
        document.addEventListener('copy', (e) => {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
            const selected = document.querySelectorAll('.builder-cell.selected');
            if (selected.length === 0) return;
    
            const rowMap = new Map();
            selected.forEach(td => {
                const tr = td.parentElement;
                if(!rowMap.has(tr)) rowMap.set(tr, []);
                rowMap.get(tr).push(td.innerText.trim());
            });
    
            const tsv = Array.from(rowMap.values()).map(row => row.join('\t')).join('\n');
            e.clipboardData.setData('text/plain', tsv);
            e.preventDefault();
        });
    
        document.addEventListener('paste', (e) => {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
            
            const activeCell = document.querySelector('.builder-cell.selected') || document.activeElement.closest('td.builder-cell');
            if (activeCell) {
                saveBuilderState();
                e.preventDefault();
                const text = e.clipboardData.getData('text/plain');
                const rowsData = text.split(/\r?\n/).map(r => r.split('\t'));
                
                const startR = parseInt(activeCell.dataset.row);
                const startC = parseInt(activeCell.dataset.col);
                
                rowsData.forEach((rowData, i) => {
                    rowData.forEach((val, j) => {
                        const td = document.querySelector(`.builder-cell[data-row="${startR + i}"][data-col="${startC + j}"]`);
                        if (td) {
                            td.textContent = val;
                        }
                    });
                });
            }
        });
    };

    const tryLogin = async () => {

      if (uname.includes('@')) {
        try {

          }

      }
    
      const adminAuthSnap = await getDoc(doc(db, `${BASE_PATH}/settings`, 'adminAuth'));
      const adminAuth = adminAuthSnap.exists() ? adminAuthSnap.data() : {};
      if (!session && String(adminAuth.email || '').toLowerCase() === uname && String(adminAuth.password || '').trim() === password) {
        session = { name: 'Super Admin', username, type: 'Admin', source: 'legacy-admin', photo: 'assets/images/logo.png' };
      }
    
      if (!session) {
        const staffSnap = await getDocs(collection(db, `${BASE_PATH}/staff`));
        const staff = staffSnap.docs.map((docSnap) => ({ id: docSnap.id, ...docSnap.data() })).find((item) => item.isActive !== false && (((item.email || '').toLowerCase() === uname) || ((item.username || '').toLowerCase() === uname)) && String(item.password || '').trim() === password);
        if (staff) session = { ...staff, name: staff.name || 'Staff', username, type: staff.type || 'Staff', source: 'staff', photo: staff.photo || '' };
      }
    
      if (!session) {
        const dirSnap = await getDocs(collection(db, `${BASE_PATH}/publicDirectory`));
        const directoryUser = dirSnap.docs.map((docSnap) => ({ id: docSnap.id, ...docSnap.data() })).find((entry) => {
          const meta = entry.authMeta || {};
          return String(meta.username || '').toLowerCase() === uname && String(meta.passwordHash || '') === passHash;
        });
        if (directoryUser) session = { id: directoryUser.id, ...(directoryUser.values || {}), name: String(directoryUser.values?.name || 'Directory User'), username, type: 'Category User', source: 'directory', categoryId: directoryUser.categoryId, photo: String(directoryUser.values?.photo || directoryUser.values?.image || '') };
      }
    
      if (!session) return showMsg('Invalid credentials / access denied');
      userSession = session;
      await loadData();
      localStorage.setItem(OFFICIAL_SESSION_KEY, JSON.stringify(userSession));
      showApp();
    };
    
    onAuthStateChanged(auth, async (user) => {
      if (!user) await signInAnonymously(auth);
      authReady = true;
    });
    
    document.getElementById('official-login-btn').addEventListener('click', tryLogin);
    document.getElementById('official-password').addEventListener('keydown', (event) => { if (event.key === 'Enter') tryLogin(); });
    document.getElementById('official-username').addEventListener('keydown', (event) => { if (event.key === 'Enter') tryLogin(); });
    document.getElementById('official-toggle-password').addEventListener('click', () => {
      const input = document.getElementById('official-password');
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      document.getElementById('official-toggle-password').className = isPassword ? 'fas fa-eye-slash trailing-icon' : 'fas fa-eye trailing-icon';
    });
    document.getElementById('official-logout-btn').addEventListener('click', () => {
      localStorage.removeItem(OFFICIAL_SESSION_KEY);
      window.location.reload();
    });
    
    const restoreOfficialSession = async () => {
      try {
        if (window.AppSession && window.AppSession.isFresh()) {
          const role = window.AppSession.getRole();
          if (role === 'admin' || role === 'staff') {
            const stateKey = role === 'admin' ? 'app_session_admin_state' : 'app_session_staff_state';
            const rawState = localStorage.getItem(stateKey);
            const state = rawState ? JSON.parse(rawState) : {};
            
            userSession = {
              name: state.name || (role === 'admin' ? 'Super Admin' : 'Staff'),
              username: state.email || 'admin',
              type: role === 'admin' ? 'Admin' : 'Staff',
              source: role === 'admin' ? 'firebase' : 'staff'
            };
            await loadData();
            showApp();
            return; 
          }
        }
        const raw = localStorage.getItem(OFFICIAL_SESSION_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!parsed?.username) return;
        userSession = parsed;
        await loadData();
        showApp();
      } catch (_error) {}
    };
    
    preloadOfficialBranding();
    restoreOfficialSession();
  </script>
</body>
</html>
